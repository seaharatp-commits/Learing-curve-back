# Example Kubernetes probes for the backend container.
# Add these fields under spec.template.spec.containers[0].
# The liveness endpoint does not query PostgreSQL; readiness does.

livenessProbe:
  httpGet:
    path: /api/health
    port: 3333
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health/ready
    port: 3333
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
